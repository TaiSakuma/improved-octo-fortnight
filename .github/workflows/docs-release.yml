name: Deploy release docs

on:
  workflow_run:
    workflows: ["Generate changelog"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout release tag
        id: checkout
        uses: TaiSakuma/checkout-version-tag@920911b2aaaea227efc3a0e50c201aa03ccafa0c # v1.2.0
        with:
          trigger-tag: ${{ github.event.workflow_run.head_branch }}

      - name: Extract version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.checkout.outputs.release-tag }}

      # Decide "is this the newest release?" over every v* tag by version
      # order, so a backport never overwrites the /latest/ docs.
      # checkout-version-tag checks out a single tag, so fetch them all.
      - name: Determine whether this is the newest release
        id: latest
        env:
          RELEASE_TAG: ${{ steps.checkout.outputs.release-tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          newest="$(git tag -l 'v*' | sort -V | tail -n1)"
          if [ "${newest}" = "${RELEASE_TAG}" ]; then
            echo "is-latest=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is-latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - uses: ./.github/actions/build-docs
        id: build
        with:
          subdir: ${{ steps.version.outputs.version }}

      - uses: ./.github/actions/build-docs
        id: build-latest
        if: steps.latest.outputs.is-latest == 'true'
        with:
          subdir: latest
          site-dir: /tmp/built-site-latest

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: ./.github/actions/deploy-to-gh-pages
        with:
          site-dir: ${{ steps.build.outputs.site-dir }}
          target: ${{ steps.version.outputs.version }}
          commit-message: Deploy docs for v${{ steps.version.outputs.version }}

      - name: Update latest
        if: steps.latest.outputs.is-latest == 'true'
        run: |
          git worktree add /tmp/gh-pages gh-pages
          cd /tmp/gh-pages
          rm -rf latest
          cp -r "${{ steps.build-latest.outputs.site-dir }}" latest
          git add latest
          git diff --cached --quiet || git commit -m "Update latest"
          git push origin gh-pages

      - if: steps.latest.outputs.is-latest == 'true'
        run: git worktree remove /tmp/gh-pages

      - uses: ./.github/actions/update-index
        with:
          repo-name: ${{ github.event.repository.name }}
          repo-url: ${{ github.event.repository.html_url }}
