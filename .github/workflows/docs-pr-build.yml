name: Build docs preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  SITE_DIR: /tmp/built-site

concurrency:
  group: docs-build-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # Reference the action from @main so the build scripts (action.yml and
      # override_site_url.py) always come from the trusted main branch, not from
      # the PR's checkout.
      - uses: TaiSakuma/improved-octo-fortnight/.github/actions/build-docs@main
        id: build
        with:
          subdir: pr/${{ github.event.number }}
          site-dir: ${{ env.SITE_DIR }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview
          path: ${{ env.SITE_DIR }}
          retention-days: 1

      - name: Save PR number
        run: echo "${{ github.event.number }}" > "$RUNNER_TEMP/pr-number"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-metadata
          path: ${{ runner.temp }}/pr-number
          retention-days: 1
